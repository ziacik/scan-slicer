[package]
name = "scan-slicer"
version = "0.1.0"
edition = "2024"
description = "A small desktop app for splitting scanned photo sheets into individual images."
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_4"] }
gdk-pixbuf = "0.22"
image = { version = "0.25", features = ["png", "jpeg", "tiff"] }
imageproc = { version = "0.27", default-features = false }
rfd = "0.15"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
futures-lite = "2"
