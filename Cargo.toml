[package]
name = "scan-slicer"
version = "0.1.0"
edition = "2024"
description = "A small desktop app for splitting scanned photo sheets into individual images."
license = "MIT"

[dependencies]
eframe = "0.33"
egui_extras = { version = "0.33", features = ["image"] }
image = { version = "0.25", features = ["png", "jpeg", "tiff"] }
rfd = "0.15"
anyhow = "1"
opencv = { version = "0.100", default-features = false, features = ["imgproc", "geometry"] }
